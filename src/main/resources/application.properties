# Application Configuration
server.port=8080
server.servlet.context-path=/quota-service

# Tomcat Configuration for High Concurrency
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=20000
server.tomcat.accept-count=1000
server.tomcat.connection-timeout=30000

# Spring Configuration
spring.application.name=resource-quota-service

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging Configuration - Anti-pattern: Excessive logging levels
logging.level.com.hackday.quota=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.root=INFO

# Anti-pattern: Log everything to files without rotation limits
logging.file.name=quota-service.log
logging.file.max-size=1GB
logging.file.max-history=365
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Anti-pattern: Enable all actuator endpoints with detailed logging
management.endpoints.web.exposure.include=*
management.endpoint.loggers.enabled=true
management.endpoint.heapdump.enabled=true
management.endpoint.threaddump.enabled=true

# Performance Tuning
spring.task.execution.pool.core-size=50
spring.task.execution.pool.max-size=200
spring.task.execution.pool.queue-capacity=10000
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=quota-task-

# Caching
spring.cache.type=caffeine
spring.cache.caffeine.spec=initialCapacity=5000,maximumSize=25000,expireAfterWrite=10m,expireAfterAccess=5m,recordStats
